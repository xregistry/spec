name: verify
on: [push, pull_request]
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "tools/requirements.txt"
      - name: Install tools dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify Specification
        run: make -f tools/Makefile

  examples:
    name: Examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install -r tools/requirements.txt
      - name: Validate shared source
        run: python -B -m workingdrafts.federation.tools.generate_examples validate
      - name: Exercise generated bindings
        run: python -B -m pytest workingdrafts/bindings/tools workingdrafts/federation/tools tools/test_samples.py -q

  oci-roundtrip:
    name: OCI Distribution round trip
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry@sha256:1290056e2357eceb0c047cb60ae9abb370305a218e2df650eb8d3ea021b1c151
        ports:
          - 127.0.0.1:5000:5000
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:5000/v2/ || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      XREGISTRY_TEST_REGISTRY: localhost:5000/test/catalog
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install -r tools/requirements.txt
      - name: Install ORAS 1.3.0
        shell: bash
        run: |
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/oras.tar.gz"
          echo "6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/oras"
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP/oras"
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Push, retrieve by digest and compare closure
        run: python -B -m pytest workingdrafts/federation/tools/test_generate_examples.py -q
